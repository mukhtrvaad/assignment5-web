    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

<body>

<div class="page">

    <header>
        <h1>INTERACTIVE WEB</h1>
        <p>JavaScript Practice</p>

    <nav>
        <a href="index.html">PART 1</a>
        <a href="part2.html">PART 2</a>

    <main>
        <h2>Part 3 — Events</h2>

        <section>
            <h3>Task 5 — Mouse Events</h3>

            <div id="hoverBox" class="demo-box">
                Hover over me
            </div>
        </section>

        <section>
            <h3>Task 6 — Keyboard Events</h3>

            <input type="text" id="inputText"
                   placeholder="Type something">

            <p>Current value: <span id="outputText"></span></p>
        </section>

        <section>
            <h3>Task 7 — Calculator</h3>

            <div class="calculator">
                <input type="number" id="num1"
                       placeholder="First number">

                <select id="operation">
                    <option value="+">+</option>
                    <option value="-">−</option>
                    <option value="*">×</option>
                    <option value="/">÷</option>
                </select>

                <input type="number" id="num2"
                       placeholder="Second number">

                <button id="calculateBtn">Calculate</button>
            </div>

            <p id="result">Result: —</p>
        </section>
    </main>

    <footer>&copy; 2026 | Interactive Web</footer>
    
</div>

</body>
